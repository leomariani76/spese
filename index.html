<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spese">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Le mie spese</title>
</head>
<body>
  <div id="app">
    <main id="main">
      <section id="view-mese" class="view active" aria-label="Spese del mese"></section>
      <section id="view-andamento" class="view" aria-label="Andamento"></section>
      <section id="view-nexi" class="view" aria-label="Importa da Nexi"></section>
      <section id="view-altro" class="view" aria-label="Impostazioni"></section>
    </main>

    <nav class="tabbar" aria-label="Navigazione">
      <button class="tab active" data-tab="mese" aria-label="Mese">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Mese</span>
      </button>
      <button class="tab" data-tab="andamento" aria-label="Andamento">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>
        <span>Andamento</span>
      </button>
      <button class="tab tab-add" data-action="add" aria-label="Aggiungi spesa">
        <span class="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button class="tab" data-tab="nexi" aria-label="Importa Nexi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/></svg>
        <span>Nexi</span>
      </button>
      <button class="tab" data-tab="altro" aria-label="Altro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/></svg>
        <span>Altro</span>
      </button>
    </nav>
  </div>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
